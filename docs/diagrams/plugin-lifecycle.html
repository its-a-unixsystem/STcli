<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STcli Plugin Lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lifecycle · Plugin Authoring &amp; Execution</p>
    <h1>From Bundle to Recorded Effects</h1>

    <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-lifecycle-title plugin-lifecycle-desc">
      <title id="plugin-lifecycle-title">Plugin Lifecycle: From Bundle to Recorded Effects</title>
      <desc id="plugin-lifecycle-desc">An author writes a plugin bundle, then validates it with plugin doctor, installs it to the local store, and adopts it into a session with a pinned version, digest, and capabilities. On each turn the engine runs the plugin in a sandbox as a pure function, validates the returned effects against the grant, applies the allowed effects to state and the prompt, and records them in the SQLite Turn Trace. Replay reads the recorded effects and does not run the plugin again.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ PHASE LABELS ============ -->
      <text x="48" y="132" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AUTHORING &amp; INSTALL · YOU</text>
      <text x="996" y="356" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">ENGINE · EACH TURN</text>

      <!-- ============ ARROWS (drawn before boxes) ============ -->
      <!-- row 1: left to right -->
      <line x1="228" y1="180" x2="304" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="238" y="160" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE</text>

      <line x1="484" y1="180" x2="560" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="500" y="160" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>

      <line x1="740" y1="180" x2="816" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="756" y="160" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="778" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GRANT</text>

      <!-- adopt -> run: straight vertical drop (shared x) -->
      <line x1="906" y1="216" x2="906" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="912" y="296" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="916" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INVOKE</text>

      <!-- row 2: right to left -->
      <line x1="816" y1="428" x2="740" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="754" y="408" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="778" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EFFECTS</text>

      <line x1="560" y1="428" x2="484" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="498" y="408" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWED</text>

      <line x1="304" y1="428" x2="228" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="240" y="408" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORD</text>

      <!-- ============ SANDBOX BOUNDARY (around run) ============ -->
      <rect x="800" y="380" width="196" height="96" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="812" y="374" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="383" fill="#b0562a" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">SANDBOX · NO NET / FS / SECRETS</text>

      <!-- ============ ROW 1 NODES ============ -->
      <!-- write bundle (input) -->
      <rect x="48" y="144" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="144" width="180" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="152" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="82" y="161" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTHOR</text>
      <text x="138" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write bundle</text>
      <text x="138" y="202" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest + component</text>

      <!-- doctor -->
      <rect x="304" y="144" width="180" height="72" rx="6" fill="#ffffff"/>
      <rect x="304" y="144" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="326" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="394" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plugin doctor</text>
      <text x="394" y="202" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">schema + digest</text>

      <!-- install -->
      <rect x="560" y="144" width="180" height="72" rx="6" fill="#ffffff"/>
      <rect x="560" y="144" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="582" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="650" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plugin install</text>
      <text x="650" y="202" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local store</text>

      <!-- adopt -->
      <rect x="816" y="144" width="180" height="72" rx="6" fill="#ffffff"/>
      <rect x="816" y="144" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="824" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="838" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="906" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plugin adopt</text>
      <text x="906" y="202" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pin version + grant</text>

      <!-- ============ ROW 2 NODES ============ -->
      <!-- run (FOCAL, inside sandbox) -->
      <rect x="816" y="392" width="164" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="392" width="164" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="824" y="400" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="850" y="409" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
      <text x="898" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run</text>
      <text x="898" y="450" fill="#b0562a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pure function</text>

      <!-- validate effects -->
      <rect x="560" y="392" width="180" height="72" rx="6" fill="#ffffff"/>
      <rect x="560" y="392" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="400" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="588" y="409" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="650" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">validate effects</text>
      <text x="650" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">against grant</text>

      <!-- apply -->
      <rect x="304" y="392" width="180" height="72" rx="6" fill="#ffffff"/>
      <rect x="304" y="392" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="400" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="332" y="409" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="394" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">apply</text>
      <text x="394" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state + prompt</text>

      <!-- trace (STORE) -->
      <rect x="48" y="392" width="180" height="80" fill="#f5f5f5"/>
      <path d="M52,404 V456 A86,8 0 0,0 224,456 V404" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <ellipse cx="138" cy="404" rx="86" ry="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="138" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turn Trace</text>
      <text x="138" y="448" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite · WAL</text>

      <!-- editorial aside: replay -->
      <text x="48" y="500" fill="#7a8399" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">Replay reads the recorded effects.</text>
      <text x="48" y="518" fill="#7a8399" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">The plugin does not run again.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="48" y1="548" x2="992" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="560" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="70" y="571" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RUNTIME (FOCAL)</text>
      <rect x="256" y="560" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="278" y="571" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CLI / HOST STEP</text>
      <rect x="464" y="560" width="14" height="14" rx="3" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="486" y="571" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">AUTHOR INPUT</text>
      <rect x="664" y="560" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="686" y="571" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>
      <rect x="808" y="560" width="14" height="14" rx="3" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="830" y="571" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SANDBOX</text>
    </svg>
  </div>
</body>
</html>
