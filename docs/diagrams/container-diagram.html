<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STcli Container Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Container Diagram</p>
    <h1>Containers — STcli Workspace</h1>

    <svg viewBox="0 0 1040 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnt-title cnt-desc">
      <title id="cnt-title">Container Diagram — STcli Workspace</title>
      <desc id="cnt-desc">A Roleplayer runs the stcli-cli binary, which calls the stcli-core engine library. The core reads and writes a bundled SQLite WAL database, evaluates lore regex in an isolated regex-worker subprocess, and streams generation requests to an external OpenAI-compatible provider. The CLI drives a deterministic provider-test fixture server during integration testing.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONE: workspace boundary ============ -->
      <rect x="40" y="192" width="792" height="344" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="6,4"/>
      <rect x="56" y="196" width="146" height="12" rx="2" fill="#f5f5f5"/>
      <text x="64" y="205" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STCLI WORKSPACE</text>

      <!-- ============ ARROWS ============ -->
      <!-- user -> cli -->
      <line x1="240" y1="112" x2="240" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="168" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RUNS</text>

      <!-- cli -> core -->
      <line x1="240" y1="312" x2="240" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="336" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="345" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ENGINE API</text>

      <!-- core -> sqlite -->
      <line x1="360" y1="440" x2="536" y2="440" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="428" y="420" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ/WRITE</text>

      <!-- core -> regex-worker -->
      <path d="M296,408 H520 Q528,408 528,400 V352" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="360" y="388" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDIN/STDOUT</text>

      <!-- core -> provider (link, routed below the store) -->
      <path d="M240,480 V500 Q240,508 248,508 H752 Q760,508 760,500 V368" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="466" y="512" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="502" y="521" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS SSE</text>

      <!-- cli -> mock server (dashed, test) -->
      <path d="M360,280 H712 Q720,280 720,272 V208" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="470" y="260" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEST HTTPS</text>

      <!-- ============ NODES ============ -->
      <!-- user (person) -->
      <rect x="160" y="40" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="40" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="168" y="48" width="46" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.55)" stroke-width="0.8"/>
      <text x="191" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSON</text>
      <text x="240" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Roleplayer</text>
      <text x="240" y="100" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs sessions</text>

      <!-- stcli-cli -->
      <rect x="160" y="248" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="248" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="256" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="185" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BIN</text>
      <text x="240" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stcli-cli</text>
      <text x="240" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clap · json/jsonl</text>

      <!-- stcli-core (FOCAL) -->
      <rect x="128" y="392" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="392" width="224" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="136" y="400" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="162" y="409" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIBRARY</text>
      <text x="240" y="436" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stcli-core</text>
      <text x="240" y="454" fill="#b0562a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">engine · domain logic</text>
      <text x="240" y="470" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompt · lore · macros · state</text>

      <!-- regex-worker -->
      <rect x="448" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="448" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="456" y="296" width="66" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="489" y="305" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBPROCESS</text>
      <text x="528" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">regex-worker</text>
      <text x="528" y="344" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">size + time limits</text>

      <!-- SQLite (store, cylinder) -->
      <rect x="536" y="404" width="168" height="76" fill="#f5f5f5"/>
      <path d="M540,416 V468 A78,8 0 0,0 696,468 V416" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <ellipse cx="618" cy="416" rx="78" ry="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="618" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite WAL</text>
      <text x="618" y="460" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rusqlite · bundled</text>

      <!-- provider-test (mock, test-only, dashed) -->
      <rect x="640" y="144" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="144" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="648" y="152" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="665" y="161" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEST</text>
      <text x="720" y="178" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">provider-test</text>
      <text x="720" y="192" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">axum · rustls</text>

      <!-- provider (external) -->
      <rect x="720" y="304" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="304" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="728" y="312" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="745" y="321" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <text x="808" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>
      <text x="808" y="356" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">openai-compatible</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="576" x2="1000" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="588" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="62" y="599" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ENGINE (FOCAL)</text>
      <rect x="216" y="588" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="238" y="599" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CONTAINER</text>
      <rect x="380" y="588" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="402" y="599" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATA STORE</text>
      <rect x="536" y="588" width="14" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="558" y="599" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TEST-ONLY</text>
      <line x1="688" y1="595" x2="716" y2="595" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <text x="724" y="599" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS SSE CALL</text>
    </svg>
  </div>
</body>
</html>
