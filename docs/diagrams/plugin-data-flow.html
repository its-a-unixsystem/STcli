<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STcli Plugin Data Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow · Plugin Execution</p>
    <h1>Plugin Execution During a Turn</h1>

    <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plg-title plg-desc">
      <title id="plg-title">Plugin Execution During a Turn</title>
      <desc id="plg-desc">During a turn the Turn Orchestrator invokes the Plugin Host in topological order, which calls each pure Wasm plugin inside a capability sandbox with a lifecycle event and permitted reads. The plugin returns declarative effects; the host applies own-namespace state writes to the overlay and injects prompt contributions into closed slots, and the orchestrator records the effect receipt in the SQLite trace. The host and plugin runtime are planned, not yet implemented.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ SANDBOX BOUNDARY ============ -->
      <rect x="736" y="160" width="248" height="140" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="752" y="154" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="163" fill="#b0562a" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">WASM SANDBOX · NO NET/FS/SECRETS</text>

      <!-- ============ ARROWS ============ -->
      <!-- 1 turn -> extHost -->
      <line x1="256" y1="228" x2="392" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="268" y="208" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOPO ORDER</text>
      <!-- 2 extHost -> ext (forward call) -->
      <line x1="584" y1="216" x2="752" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="629" y="196" width="86" height="12" rx="2" fill="#f5f5f5"/>
      <text x="672" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT + READS</text>
      <!-- 3 ext -> extHost (return, dashed) -->
      <line x1="760" y1="240" x2="592" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="628" y="248" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="672" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EFFECTS RETURN</text>
      <!-- 4 extHost -> state -->
      <line x1="464" y1="264" x2="464" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="472" y="322" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="331" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STATE WRITE</text>
      <!-- 5 extHost -> prompt -->
      <path d="M540,264 V330 Q540,338 548,338 H664 Q672,338 672,346 V392" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="596" y="318" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="327" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INJECT SLOT</text>
      <!-- 6 turn -> sqlite -->
      <line x1="164" y1="264" x2="164" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="172" y="322" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="331" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RECEIPT</text>

      <!-- ============ STEP BADGES ============ -->
      <circle cx="324" cy="228" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="324" y="231" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <circle cx="602" cy="216" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="602" y="219" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <circle cx="732" cy="240" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <circle cx="464" cy="352" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="464" y="355" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <circle cx="540" cy="300" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="540" y="303" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <circle cx="164" cy="352" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="164" y="355" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>

      <!-- ============ NODES ============ -->
      <!-- turn (FOCAL) -->
      <rect x="72" y="192" width="184" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="192" width="184" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="80" y="200" width="80" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="120" y="209" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORCHESTRATOR</text>
      <text x="164" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turn Orchestrator</text>
      <text x="164" y="250" fill="#b0562a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">turn.rs</text>

      <!-- extHost (planned) -->
      <rect x="392" y="192" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="192" width="192" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="400" y="200" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="426" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="488" y="234" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plugin Host</text>
      <text x="488" y="250" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loads Wasm components</text>

      <!-- ext (planned, inside sandbox) -->
      <rect x="760" y="192" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="192" width="200" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="768" y="200" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="794" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANNED</text>
      <text x="860" y="234" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wasm Plugin</text>
      <text x="860" y="250" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pure declarative effects</text>

      <!-- sqlite (store) -->
      <rect x="72" y="392" width="184" height="76" fill="#f5f5f5"/>
      <path d="M76,404 V456 A86,8 0 0,0 248,456 V404" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <ellipse cx="162" cy="404" rx="86" ry="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="162" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite</text>
      <text x="162" y="448" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trace events · WAL</text>

      <!-- state (store) -->
      <rect x="384" y="392" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="392" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="392" y="400" width="38" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="411" y="409" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="464" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">State Store</text>
      <text x="464" y="448" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">overlay</text>

      <!-- prompt -->
      <rect x="592" y="392" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="392" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="600" y="400" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="626" y="409" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT</text>
      <text x="672" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prompt Manager</text>
      <text x="672" y="448" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">closed slots</text>

      <!-- editorial aside -->
      <text x="760" y="344" fill="#7a8399" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">Host specified; Wasm runtime</text>
      <text x="760" y="362" fill="#7a8399" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">not yet implemented.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="72" y1="516" x2="968" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="72" y="528" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="94" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ORCHESTRATOR (FOCAL)</text>
      <rect x="316" y="528" width="14" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="338" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PLANNED COMPONENT</text>
      <rect x="556" y="528" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="578" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>
      <circle cx="659" cy="535" r="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="659" y="538" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">n</text>
      <text x="674" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ORDERED STEP</text>
      <line x1="820" y1="535" x2="848" y2="535" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="856" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>
    </svg>
  </div>
</body>
</html>
