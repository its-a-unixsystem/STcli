<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STcli Engine Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1160px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · STcli PRD</p>
    <h1>STcli Engine Architecture</h1>

    <svg viewBox="0 0 1080 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stcli-arch-title stcli-arch-desc">
      <title id="stcli-arch-title">STcli Engine Architecture</title>
      <desc id="stcli-arch-desc">Top-down architecture: a debug CLI and a post-MVP TUI call a Command/Event seam into the SessionEngine, whose Turn Transaction atomically orchestrates the PromptCompiler, LoreEngine, StateStore, Wasm PluginHost, and an OpenAI-compatible Provider, backed by shared Codec and Tokenizer registries and a SQLite WAL store.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <!-- Frontends -->
      <rect x="344" y="24" width="392" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="356" y="40" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FRONTENDS</text>
      <!-- Turn subsystems -->
      <rect x="28" y="432" width="1024" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="36" y="440" width="102" height="12" rx="2" fill="#f5f5f5"/>
      <text x="40" y="450" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TURN SUBSYSTEMS</text>

      <!-- ============ ARROWS (drawn before nodes) ============ -->
      <!-- CLI -> CE -->
      <line x1="440" y1="120" x2="440" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- TUI -> CE (post-MVP, dashed) -->
      <line x1="640" y1="120" x2="640" y2="160" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- CE -> SE -->
      <line x1="540" y1="208" x2="540" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CR -> SE -->
      <line x1="280" y1="272" x2="440" y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- SE -> DB -->
      <line x1="640" y1="272" x2="800" y2="272" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="698" y="250" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERSIST</text>
      <!-- SE -> TT -->
      <line x1="540" y1="304" x2="540" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- TT -> PC -->
      <path d="M456,416 V424 Q456,432 448,432 H132 Q124,432 124,440 V464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- TT -> LE -->
      <path d="M496,416 V436 Q496,444 488,444 H340 Q332,444 332,452 V464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- TT -> SS -->
      <line x1="540" y1="416" x2="540" y2="464" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- TT -> EH -->
      <path d="M584,416 V436 Q584,444 592,444 H740 Q748,444 748,452 V464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- TT -> MP (provider call, link-blue) -->
      <path d="M624,416 V424 Q624,432 632,432 H948 Q956,432 956,440 V464" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="678" y="410" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="702" y="419" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>
      <!-- PC -> TR -->
      <path d="M124,528 V596 Q124,604 132,604 H188 Q196,604 196,612 V612" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- LE -> TR -->
      <path d="M332,528 V596 Q332,604 324,604 H268 Q260,604 260,612 V612" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ============ NODES ============ -->
      <!-- CLI (frontend / MVP) -->
      <rect x="360" y="56" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="56" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="368" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.55)" stroke-width="0.8"/>
      <text x="382" y="73" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MVP</text>
      <text x="440" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Debug CLI</text>
      <text x="440" y="112" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">json / jsonl</text>

      <!-- TUI (post-MVP / optional) -->
      <rect x="560" y="56" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="56" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="568" y="64" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="596" y="73" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST-MVP</text>
      <text x="640" y="98" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rich TUI</text>
      <text x="640" y="112" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">planned</text>

      <!-- CE seam (Command/Event Interface) -->
      <rect x="340" y="160" width="400" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="160" width="400" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="181" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Command / Event Interface</text>
      <text x="540" y="197" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">execute() · inspect() · stream&lt;Event&gt;</text>

      <!-- CR (Codec Registry) -->
      <rect x="120" y="240" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="240" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="128" y="248" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="150" y="257" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODECS</text>
      <text x="200" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Codec Registry</text>
      <text x="200" y="296" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">built-in</text>

      <!-- SE (SessionEngine) -->
      <rect x="440" y="240" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="240" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="448" y="248" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="470" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
      <text x="540" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SessionEngine</text>
      <text x="540" y="296" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">authority · projection</text>

      <!-- DB (SQLite WAL) — cylinder store -->
      <rect x="798" y="236" width="164" height="72" fill="#f5f5f5"/>
      <path d="M800,248 V296 A80,8 0 0,0 960,296 V248" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <ellipse cx="880" cy="248" rx="80" ry="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="880" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite</text>
      <text x="880" y="290" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WAL mode</text>

      <!-- TT (Turn Transaction) — FOCAL -->
      <rect x="440" y="344" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="344" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="448" y="352" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="463" y="361" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TXN</text>
      <text x="540" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turn Transaction</text>
      <text x="540" y="402" fill="#b0562a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">atomic · all-or-nothing</text>

      <!-- PC (PromptCompiler) -->
      <rect x="44" y="464" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="44" y="464" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="52" y="472" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="74" y="481" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT</text>
      <text x="124" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PromptCompiler</text>
      <text x="124" y="520" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">budget-aware</text>

      <!-- LE (LoreEngine) -->
      <rect x="252" y="464" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="252" y="464" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="260" y="472" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="277" y="481" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LORE</text>
      <text x="332" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LoreEngine</text>
      <text x="332" y="520" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">world info</text>

      <!-- SS (StateStore) -->
      <rect x="460" y="464" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="464" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="468" y="472" width="38" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="487" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="540" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StateStore</text>
      <text x="540" y="520" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">variables</text>

      <!-- EH (Pure Wasm PluginHost) -->
      <rect x="668" y="464" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="668" y="464" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="676" y="472" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
      <text x="694" y="481" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WASM</text>
      <text x="748" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PluginHost</text>
      <text x="748" y="520" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sandboxed</text>

      <!-- MP (OpenAI-Compatible Provider) — external -->
      <rect x="876" y="464" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="876" y="464" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="884" y="472" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="902" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <text x="956" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>
      <text x="956" y="520" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">openai-compat</text>

      <!-- TR (Tokenizer Registry) -->
      <rect x="148" y="612" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="148" y="612" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="156" y="620" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="178" y="629" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOKENS</text>
      <text x="228" y="654" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tokenizer Registry</text>
      <text x="228" y="668" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per-model</text>

      <!-- ============ LEGEND ============ -->
      <line x1="44" y1="700" x2="1036" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <!-- focal -->
      <rect x="44" y="712" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="66" y="723" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TRANSACTION BOUNDARY (FOCAL)</text>
      <!-- store -->
      <rect x="332" y="712" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="354" y="723" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE / REGISTRY</text>
      <!-- external -->
      <rect x="540" y="712" width="14" height="14" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="562" y="723" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNAL PROVIDER</text>
      <!-- post-mvp -->
      <rect x="748" y="712" width="14" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="770" y="723" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">POST-MVP</text>
      <!-- provider call -->
      <line x1="900" y1="719" x2="928" y2="719" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <text x="936" y="723" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROVIDER CALL</text>
    </svg>
  </div>
</body>
</html>
