<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STcli derivation chain · data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 800px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 640px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Derivation chain</p>
    <h1>STcli trace derivation</h1>

    <svg viewBox="0 0 616 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-dm-title flow-dm-desc">
      <title id="flow-dm-title">STcli trace derivation</title>
      <desc id="flow-dm-desc">Data flow showing how a user action becomes a Turn Trace, which derives a Session Projection and a Portable Capsule, which enables Replay.</desc>
      <defs>
        <pattern id="dots-flow" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arr-muted-flow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent-flow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link-flow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots-flow)" opacity="0.55"/>

      <!-- Lane tints (odd-indexed: 0, 2) -->
      <rect x="0" y="36" width="616" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="616" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Lane dividers -->
      <line x1="0" y1="36" x2="616" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="616" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="616" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="616" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="616" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Label column right border -->
      <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Step header chips -->
      <!-- Step 0: RECORD -->
      <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="196" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">01</text>
      <text x="196" y="29" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECORD</text>

      <!-- Step 1: PROJECT -->
      <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="308" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">02</text>
      <text x="308" y="29" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROJECT</text>

      <!-- Step 2: EXPORT (focal) -->
      <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
      <text x="420" y="14" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">03</text>
      <text x="420" y="29" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXPORT</text>

      <!-- Step 3: CONSUME -->
      <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="532" y="14" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">04</text>
      <text x="532" y="29" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONSUME</text>

      <!-- Lane labels -->
      <text x="70" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SESSION</text>
      <text x="70" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LIVE</text>

      <text x="70" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TRACE</text>
      <text x="70" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AUTHORITY</text>

      <text x="70" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CAPSULE</text>
      <text x="70" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXPORT</text>

      <text x="70" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REPLAY</text>
      <text x="70" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSUME</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- 1. SES/RECORD → TRC/RECORD: vertical, same step -->
      <line x1="196" y1="108" x2="196" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted-flow)"/>

      <!-- 2. TRC/RECORD → TRC/PROJECT: horizontal, same lane -->
      <line x1="246" y1="156" x2="258" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted-flow)"/>

      <!-- 3. TRC/RECORD → CAP/EXPORT: focal, cross-lane cross-step -->
      <path d="M 246,156 H 412 Q 420,156 420,164 V 204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent-flow)"/>
      <!-- Focal arrow label with mask -->
      <rect x="300" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="332" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600">TRACE SLICE</text>

      <!-- 4. CAP/EXPORT → RPL/CONSUME: cross-lane cross-step, link -->
      <path d="M 470,236 H 524 Q 532,236 532,244 V 284" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arr-link-flow)"/>

      <!-- Nodes -->
      <!-- SES/RECORD: User Action -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="159" y="55" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">SES</text>
      <text x="196" y="67" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">User Action</text>
      <text x="196" y="79" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">send · continue · regen</text>
      <text x="196" y="91" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">debug CLI</text>
      <!-- Output chip: DB -->
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="234" y="104" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>

      <!-- TRC/RECORD: Turn Trace -->
      <rect x="146" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="150" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="159" y="135" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">TRC</text>
      <text x="196" y="147" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Turn Trace</text>
      <text x="196" y="159" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">authoritative · append-only</text>
      <text x="196" y="171" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite</text>
      <!-- Input chip: DB -->
      <rect x="150" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="158" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <!-- Output chip: DB -->
      <rect x="226" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="234" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>

      <!-- TRC/PROJECT: Session Projection -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="271" y="135" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">TRC</text>
      <text x="308" y="147" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Session Projection</text>
      <text x="308" y="159" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">rebuildable view</text>
      <text x="308" y="171" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">projection engine</text>
      <!-- Input chip: DB -->
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="270" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <!-- Output chip: TB -->
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="346" y="184" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">TB</text>

      <!-- CAP/EXPORT: Portable Capsule (focal) -->
      <rect x="370" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="374" y="208" width="18" height="10" rx="3" fill="rgba(235,108,54,0.18)"/>
      <text x="383" y="215" fill="#eb6c36" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CAP</text>
      <text x="420" y="227" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Portable Capsule</text>
      <text x="420" y="239" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">self-contained</text>
      <text x="420" y="251" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">embeds all content</text>
      <!-- Input chip: DB -->
      <rect x="374" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="382" y="264" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <!-- Output chip: FL -->
      <rect x="450" y="258" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="458" y="264" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">FL</text>

      <!-- RPL/CONSUME: Replay -->
      <rect x="482" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="486" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.18)"/>
      <text x="495" y="295" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">RPL</text>
      <text x="532" y="307" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Replay</text>
      <text x="532" y="319" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">no live effects</text>
      <text x="532" y="331" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">recorded outcomes</text>
      <!-- Input chip: FL -->
      <rect x="486" y="338" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="494" y="344" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">FL</text>
      <!-- Output chip: FL -->
      <rect x="562" y="338" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="570" y="344" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">FL</text>

      <!-- Annotations -->
      <!-- Thin Capsule annotation -->
      <text x="612" y="220" fill="#2d3142" font-size="11" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Thin Capsule references</text>
      <text x="612" y="234" fill="#2d3142" font-size="11" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">local content instead</text>
      <path d="M 540,228 Q 480,232 470,236" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="470" cy="236" r="2" fill="#2d3142"/>

      <!-- Rerun annotation -->
      <text x="612" y="300" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Rerun submits the recorded</text>
      <text x="612" y="314" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">request as a new attempt</text>
      <path d="M 540,308 Q 536,310 532,312" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="532" cy="312" r="2" fill="#4f5d75"/>

      <!-- Legend -->
      <text x="144" y="372" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STEPS</text>
      <rect x="196" y="366" width="20" height="10" rx="5" fill="rgba(45,49,66,0.12)"/>
      <text x="206" y="373" fill="#2d3142" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">01</text>
      <text x="222" y="373" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Record</text>
      <rect x="276" y="366" width="20" height="10" rx="5" fill="rgba(45,49,66,0.12)"/>
      <text x="286" y="373" fill="#2d3142" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">02</text>
      <text x="302" y="373" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Project</text>
      <rect x="356" y="366" width="20" height="10" rx="5" fill="rgba(235,108,54,0.20)"/>
      <text x="366" y="373" fill="#eb6c36" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">03</text>
      <text x="382" y="373" fill="#eb6c36" font-size="7" font-family="'Geist', sans-serif">Export</text>
      <rect x="436" y="366" width="20" height="10" rx="5" fill="rgba(45,49,66,0.12)"/>
      <text x="446" y="373" fill="#2d3142" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">04</text>
      <text x="462" y="373" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Consume</text>

      <text x="144" y="393" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DATA TYPE</text>
      <rect x="216" y="387" width="12" height="8" rx="2" fill="#5e7a9b"/>
      <text x="222" y="393" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">DB</text>
      <text x="232" y="393" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Trace data</text>
      <rect x="300" y="387" width="12" height="8" rx="2" fill="#b8915a"/>
      <text x="306" y="393" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">TB</text>
      <text x="316" y="393" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Derived view</text>
      <rect x="388" y="387" width="12" height="8" rx="2" fill="#9c6b50"/>
      <text x="394" y="393" fill="#ffffff" font-size="5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="700">FL</text>
      <text x="404" y="393" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Export file</text>
      <text x="460" y="393" fill="#7a8399" font-size="6" font-family="'Geist Mono', monospace">left = input · right = output</text>

      <text x="144" y="415" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FLOW</text>
      <line x1="196" y1="412" x2="220" y2="412" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted-flow)"/>
      <text x="228" y="415" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Derive</text>
      <line x1="280" y1="412" x2="304" y2="412" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent-flow)"/>
      <text x="312" y="415" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Focal handoff</text>
      <line x1="392" y1="412" x2="416" y2="412" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arr-link-flow)"/>
      <text x="424" y="415" fill="#4f5d75" font-size="7" font-family="'Geist', sans-serif">Consume</text>
    </svg>
  </div>
</body>
</html>
