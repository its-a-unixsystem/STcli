[workspace]
members = ["crates/stcli-core", "crates/stcli-cli", "crates/stcli-testkit", "crates/stcli-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
handlebars = "6.4.4"
eventsource-stream = "0.2.3"
crc32fast = "1.5"
flate2 = "1.1"
ratatui = "0.29"
parking_lot = "0.12"
regress = "0.12.0"
pulldown-cmark = "0.12"
jsonschema = "0.49.2"
rcgen = "0.14.9"
rquickjs = { version = "0.12.2", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
serde_jcs = "0.2.0"
toml = "0.8"
serde_json = "1.0"
toml_edit = { version = "0.22", features = ["serde"] }
sha2 = "0.10"
proptest = "1.7"
semver = { version = "1.0", features = ["serde"] }
similar = "3.2"
spdx = "0.13.5"
stcli-core = { version = "0.1.0", path = "crates/stcli-core" }
stcli-testkit = { version = "0.1.0", path = "crates/stcli-testkit" }
thiserror = "2.0"
tiktoken-rs = "0.12.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
wait-timeout = "0.2"
wasmtime = { version = "=36.0.13", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
arboard = "3.4"
tempfile = "3.0"
unicode-width = "0.2"
ulid = { version = "1.0", features = ["serde"] }
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }
