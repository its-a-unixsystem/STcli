<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #071827; color: #eef8ff; }
  body { padding: 28px; font: 18px/1.55 "DejaVu Sans", sans-serif; }
  .card {
    min-height: 330px; padding: 34px; border: 2px solid rgba(158,232,255,.62);
    border-radius: 24px; background: linear-gradient(145deg,#0a7185 0%,#153450 48%,#49204e 100%);
    box-shadow: 0 18px 42px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.22);
  }
  .header { display: flex; align-items: center; gap: 22px; }
  img { width: 112px; height: 112px; image-rendering: auto; }
  h1 { margin: 0 0 8px; font-size: 38px; letter-spacing: .04em; }
  .tag { color: #b9f4ff; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
  p { max-width: 760px; margin: 24px 0 0; }
</style>
</head>
<body>
<article class="card">
  <div class="header">
    <img src="https://stcli-render.invalid/assets/emblem.png" alt="Harbor Watch lighthouse emblem">
    <div><div class="tag">Night signal report</div><h1>Harbor Watch</h1></div>
  </div>
  <p>The lighthouse keeper records a calm sea, a steady western wind, and three vessels safely inside the breakwater. Static HTML and CSS remain readable without scripts or remote resources.</p>
</article>
</body>
</html>
