# STcli Starter Provider Templates
# Copy or symlink this file to ~/.config/stcli/provider-templates.toml or
# $STCLI_HOME/config/provider-templates.toml to make these templates available in the TUI.

[openrouter]
name = "OpenRouter"
id = "openrouter"
base_url = "https://openrouter.ai"
chat_completions_path = "/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"
default_model = "anthropic/claude-3.5-sonnet"
stream = true
timeout_seconds = 120

[openai]
name = "OpenAI"
id = "openai"
base_url = "https://api.openai.com"
chat_completions_path = "/v1/chat/completions"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-4o"
stream = true
timeout_seconds = 120

[ollama]
name = "Ollama (Local)"
id = "ollama"
base_url = "https://localhost:11434"
chat_completions_path = "/v1/chat/completions"
api_key_env = ""
default_model = "llama3.1"
stream = true
timeout_seconds = 120
