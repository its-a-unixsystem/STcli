[package]
name = "stcli-sillytavern-codec-plugin"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
crc32fast = "1.5"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wit-bindgen = "=0.41.0"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[workspace]
