[package]
name = "stcli-ccv3-codec-plugin"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wit-bindgen = "=0.41.0"
zip = { version = "7.2", default-features = false }

[workspace]
